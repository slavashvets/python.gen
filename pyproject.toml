[project]
name = "pgenie-python-gen-harness"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "psycopg[binary]>=3.3.4,<4",
    "basedpyright==1.39.10",
    "ruff==0.15.20",
]

[tool.ruff]
target-version = "py312"
line-length = 120
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
preview = false

[tool.ruff.format]
preview = false

[tool.uv]
# This project relies on mise for the Python interpreter, matching the root.
python-preference = "only-system"
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
