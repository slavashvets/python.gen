# This is a standalone repo (unlike the monorepo copy this was extracted from,
# which inherits pgn from its repo-root mise.toml), so pgn is pinned here.
[tools]
"github:pgenie-io/pgenie" = { version = "v0.9.1", exe = "pgn" }
uv = "latest"
python = "3.12"

[tasks.install]
description = "Sync the harness venv"
run = "uv sync"

[tasks.test]
description = "Run the generator harness tests"
depends = ["install"]
run = "uv run pytest tests -q"

# Cold-cache generate benchmark: current gen (`as Source` Deps) vs the same
# tree with pre-as-Source Deps, same pgn binary, fresh dhall cache per run.
# Needs a reachable Postgres (PGN_TEST_DATABASE_URL). See bench/as-source.sh
# for the PGN_BEFORE_BIN override that runs the before variant on pgn 0.8.0.
[tasks."bench:as-source"]
description = "Benchmark cold `pgn generate` with vs without `as Source` Deps"
run = "bench/as-source.sh"

# One-command builds of the fixture client for eyeballing the two variants;
# output goes to ./demo-with-as-source / ./demo-without-as-source.
[tasks."generate:as-source"]
description = "Build the fixture client with the committed `as Source` Deps"
run = "bench/generate.sh with"

[tasks."generate:no-as-source"]
description = "Build the fixture client with the pre-as-Source Deps"
run = "bench/generate.sh without"

# Regenerates only the combined "python" artifact. A full 7-artifact generate
# peaks at ~31 GB RSS, so the temp fixture keeps only the golden artifact. The
# temp copy also forces a fresh working-tree resolve and isolates pgn scratch.
[tasks.golden]
description = "Refresh the combined tests/golden package from the working-tree src/"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="$(pwd)"
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
cp -R "$root/tests/fixture-project/." "$tmp/fixture"
rm -f "$tmp/fixture/freeze1.pgn.yaml"
rm -rf "$tmp/fixture/artifacts"
sed -e '/^  # The variants below/,$d' \
    -e "s|../../src/package.dhall|$root/src/package.dhall|" \
    "$tmp/fixture/project1.pgn.yaml" > "$tmp/fixture/project1.pgn.yaml.new"
mv "$tmp/fixture/project1.pgn.yaml.new" "$tmp/fixture/project1.pgn.yaml"
cd "$tmp/fixture"
pgn --database-url "${PGN_TEST_DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable}" generate
rsync -a --delete artifacts/python/src/specimen_client/_generated/ "$root/tests/golden/src/specimen_client/_generated/"
cp artifacts/python/src/specimen_client/__init__.py "$root/tests/golden/src/specimen_client/__init__.py"
mkdir -p "$root/tests/golden/src/specimen_client/sync"
cp artifacts/python/src/specimen_client/sync/__init__.py "$root/tests/golden/src/specimen_client/sync/__init__.py"
rm -rf "$root/tests/golden_sync"
echo "combined golden refreshed; review with: git diff tests/golden"
'''
